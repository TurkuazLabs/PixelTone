# 📄 Dosya Yolu: pixeltone/src-tauri/Cargo.toml
# 📌 Amac: PixelTone Rust/Tauri paket bagimliliklarini tanimlamak
# 📌 Config - TOML
# Version: 0.1.0
# Aciklama: Tauri v2, serde ve local data path bagimliliklarini yonetir

# Bagimli Oldugu Katman: Config

[package]
name = "pixeltone"
version = "0.1.0"
description = "PixelTone platform independent color picker and palette manager"
authors = ["PixelTone"]
edition = "2021"

[lib]
name = "pixeltone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
