# 📄 Dosya Yolu: pixeltone/src-tauri/Cargo.toml
# 📌 Amac: PixelTone Rust/Tauri paket bagimliliklarini tanimlamak
# 📌 Config - TOML
# Version: 0.4.0
# Aciklama: Tauri v2, capture, picker shortcut/clipboard, storage ve Windows icon bagimliliklarini yonetir

# Bagimli Oldugu Katman: Config

[package]
name = "pixeltone"
version = "0.4.0"
description = "PixelTone platform independent color picker and palette manager"
authors = ["PixelTone"]
edition = "2021"

[lib]
name = "pixeltone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[target.'cfg(windows)'.build-dependencies]
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
xcap = "0.9.8"
mouse_position = "0.1.4"
noyalib = "0.0.44"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
