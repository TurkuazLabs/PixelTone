Bagimli Oldugu Katman: View
-->
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelTone</title>
    <link rel="stylesheet" href="/views/splash.css" />
  </head>
  <body>
    <main class="pt-splash-shell" aria-live="polite">
      <div class="pt-splash-glow pt-splash-glow-one"></div>
      <div class="pt-splash-glow pt-splash-glow-two"></div>

      <section class="pt-splash-card">
        <div class="pt-splash-brand">
          <img id="splash-brand-logo" class="pt-splash-brand-logo" alt="" />
          <div class="pt-splash-content">
            <p id="splash-product-label" class="pt-splash-product-label"></p>
            <h1 id="splash-app-name"></h1>
            <p id="splash-subtitle" class="pt-splash-subtitle"></p>
            <div class="pt-splash-promo">
              <span id="splash-website-label"></span>
              <strong id="splash-website"></strong>
            </div>
          </div>
        </div>

        <div class="pt-splash-footer">
          <span id="splash-status"></span>
          <span id="splash-version"></span>
        </div>
      </section>
    </main>

    <script type="module" src="/controllers/splash_controller.js"></script>
  </body>
</html>
