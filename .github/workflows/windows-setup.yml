# 📄 Dosya Yolu: pixeltone/.github/workflows/windows-setup.yml
# 📌 Amac: PixelTone Windows NSIS Setup.exe paketini GitHub-hosted Windows runner uzerinde uretmek
# 📌 Config - YAML
# Version: 1.1.0
# Aciklama: Manuel tetiklemede release/tag olusturmadan unsigned Setup.exe, SHA256 ve metadata artifacti uretir
#
# Bagimli Oldugu Katman: Config

name: PixelTone Windows Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixeltone-windows-setup
  cancel-in-progress: true

jobs:
  build-setup:
    name: Build PixelTone Setup.exe
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build PixelTone Setup.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_setup.ps1 -Clean

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTone-Windows-Setup
          path: |
            dist-installer/PixelTone-Setup-v*.exe
            dist-installer/PixelTone-Setup-v*.exe.sha256
            dist-installer/PixelTone-Setup-v*.json
          if-no-files-found: error
          retention-days: 14
