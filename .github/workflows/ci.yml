# 📄 Dosya Yolu: pixeltone/.github/workflows/ci.yml
# 📌 Amac: PixelTone ana CI dogrulamasini Windows self-hosted runner uzerinde calistirmak
# 📌 Config - YAML
# Version: 1.0.0
# Aciklama: GitHub hosted runner kota/billing bagimliligini kaldirir ve PR/main kontrollerini PixelTone Windows runner ile calistirir
#
# Bagimli Oldugu Katman: Config

name: PixelTone CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pixeltone-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-windows:
    name: Validate - Windows Self Hosted
    runs-on:
      - self-hosted
      - windows
      - x64
      - pixeltone

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run PixelTone Windows CI
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/ci_windows.ps1
