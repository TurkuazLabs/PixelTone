# 📄 Dosya Yolu: pixeltone/.github/workflows/ci.yml
# 📌 Amac: PixelTone kodunu public repository icin GitHub-hosted Windows, Linux ve macOS runnerlarinda dogrulamak
# 📌 Config - YAML
# Version: 1.0.3
# Aciklama: PR/main akisinda preflight, frontend build, Rust format/check ve unit testlerini platform matrisi ile temiz target uzerinde calistirir
#
# Bagimli Oldugu Katman: Config

name: PixelTone CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pixeltone-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate - ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libclang-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-targets: false

      - name: Install frontend dependencies
        run: npm install

      - name: Run Stable Desktop preflight
        run: npm run preflight

      - name: Run dependency-free tool tests
        run: npm run test:tools

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust/Tauri backend
        working-directory: src-tauri
        run: cargo check

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
